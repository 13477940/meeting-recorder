# 每次 push／PR：macOS 跑測試並包 .app；Windows 跑測試並包 MSIX（測試用自簽）。
# push 到 main：自動建立預先發行版（tag v<版本>-build.<編號>）並附上兩個平台的安裝檔。
# 推 v* tag（例如 v0.2.0）：建立正式 Release。PR 只建置、不發佈。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          # Intel 版在 Apple Silicon runner 上交叉編譯（Xcode 26 仍含 x86_64 SDK）
          - arch: x86_64
            target: x86_64-apple-darwin
    name: macos-${{ matrix.arch }}
    # screencapturekit 依賴的 apple-metal 需要 macOS 26 SDK（Xcode 26）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: 安裝 rust-toolchain.toml 指定的 Rust 與目標平台
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 測試（只在原生架構）
        if: matrix.arch == 'arm64'
        run: cargo test --release
      - run: ./scripts/bundle.sh
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingRecorder-macos-${{ matrix.arch }}
          path: dist/MeetingRecorder-macos-${{ matrix.arch }}.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          # ARM64 用原生 runner 編譯（whisper.cpp 在 ARM64 需要 clang）
          - arch: arm64
            runner: windows-11-arm
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      # whisper-rs-sys 的 bindgen 需要 libclang
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - name: 安裝 Rust（runner 沒有內建時）
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$init/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: 安裝 rust-toolchain.toml 指定的 Rust
        shell: pwsh
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - name: 檢查建置工具
        shell: pwsh
        run: |
          Get-Command cmake, clang -ErrorAction SilentlyContinue | Format-Table Name, Source
          Test-Path $env:LIBCLANG_PATH
      # whisper.cpp 的 ggml 在 ARM64 不支援 MSVC：ARM64 改用 Ninja＋clang-cl（MSVC 環境變數由 VsDevCmd 提供）
      - if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - if: matrix.arch == 'arm64'
        name: 設定 clang-cl＋Ninja
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CC=clang-cl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX=clang-cl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # cc crate 帶給 CMake 的旗標沒有開 C++ 例外，ggml 的 gguf.cpp 需要
          "CXXFLAGS=/EHsc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Command ninja, clang-cl -ErrorAction SilentlyContinue | Format-Table Name, Source
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - run: cargo test --release
      - name: 封裝 MSIX（測試用自簽憑證）
        shell: pwsh
        run: ./scripts/package-msix.ps1 -SelfSign -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingRecorder-windows-${{ matrix.arch }}
          path: |
            dist/*.msix
            dist/*.cer

  release:
    if: github.event_name == 'push'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 決定 tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            | 平台 | Apple Silicon／ARM | Intel／x64 |
            |---|---|---|
            | macOS | `MeetingRecorder-macos-arm64.zip` | `MeetingRecorder-macos-x86_64.zip` |
            | Windows | `MeetingRecorder_*_arm64.msix` | `MeetingRecorder_*_x64.msix` |

            - macOS：解壓後開啟 `MeetingRecorder.app`（未公證，第一次要在「系統設定 → 隱私權與安全性」允許開啟）。
            - Windows：先把 `MeetingRecorder-test-<架構>.cer` 匯入「本機電腦 → 受信任的人」，再雙擊 `.msix` 安裝。
            - 自動建置版本（build）尚未經實機驗證，僅供測試。
